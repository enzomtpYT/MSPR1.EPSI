[project]
name = "healthai-ai-microservice"
version = "1.0.0"
description = "Moteur de recommandations IA – HealthAI Coach (MSPR2)"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Base de données
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "motor>=3.5.0",          # MongoDB async
    "pymongo>=4.7.0",
    # ML
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    # LLM / HTTP
    "httpx>=0.27.0",
    "mistralai>=1.0.0",
    # Utilitaires
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # TestClient
    "anyio>=4.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths      = ["tests"]
asyncio_mode   = "auto"
addopts        = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html:coverage_report"

[tool.coverage.run]
source  = ["src"]
omit    = ["src/data/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 70
