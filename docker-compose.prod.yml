services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: mspr_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-etl_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-etl_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    restart: unless-stopped
    command: >
      /bin/sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_password}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Backend Microservice
  backend:
    image: ghcr.io/enzomtpyt/mspr1-backend:latest
    container_name: mspr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:password@database:5432/etl_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbit:rabbit_password@rabbitmq:5672/}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-adminpassword123}
      DEFAULT_ADMIN_IS_ADMIN: ${DEFAULT_ADMIN_IS_ADMIN:-true}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - ./MSPR1.EPSI-FastAPI/src:/app/src

  # ETL Worker Microservice
  etl-worker:
    image: ghcr.io/enzomtpyt/mspr1-etl-worker:latest
    container_name: mspr_etl_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:password@database:5432/etl_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbit:rabbit_password@rabbitmq:5672/}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # Vue.js Frontend Microservice
  frontend:
    image: ghcr.io/enzomtpyt/mspr1-frontend:latest
    container_name: mspr_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v0}
      - VITE_APP_NAME=${VITE_APP_NAME:-HealthAI Coach}

  # MongoDB for AI microservice
  mongodb:
    image: mongo:7
    container_name: healthai_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-healthai_recommendations}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Microservice (Vision / Nutrition)
  ai-microservice:
    image: ghcr.io/enzomtpyt/mspr1-ai-microservice:latest
    container_name: mspr_ai_microservice
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: ${MONGO_DB:-healthai_recommendations}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://admin:password@database:5432/etl_db}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-pixtral-12b-2409}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mongodb:
        condition: service_healthy
    volumes:
      - ai_artifacts:/app/artifacts

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: mspr_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: mspr_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  # cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: mspr_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: mspr_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:password@database:5432/etl_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      database:
        condition: service_healthy

  # MongoDB Exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.39.0
    container_name: mspr_mongodb_exporter
    restart: unless-stopped
    environment:
      MONGODB_URI: "mongodb://mongodb:27017"
    ports:
      - "9216:9216"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
    name: mspr_postgres_data
  rabbitmq_data:
    name: mspr_rabbitmq_data
  mongo_data:
    name: mspr_mongo_data
  ai_artifacts:
    name: mspr_ai_artifacts
  prometheus_data:
    name: mspr_prometheus_data
  grafana_data:
    name: mspr_grafana_data
